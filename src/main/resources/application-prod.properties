# === Database ===
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver


# === JPA(Hibernate) ===
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# === JWT ===
jwt.secret=${JWT_SECRET}

# === Kakao Map API ===
kakao.api.base-url=${KAKAO_API_BASE_URL}
kakaomap.api.key=${KAKAO_MAP_API_KEY}

# === Tmap API (Pedestrian Directions) ===
tmap.api.base-url=${TMAP_API_BASE_URL}
tmap.api.key=${TMAP_API_KEY}

# AI ?? ??
ai.server.url=https://purple-ai-server.onrender.com