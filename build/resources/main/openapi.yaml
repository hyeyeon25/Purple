openapi: 3.0.0
info:
  title: Tripick API
  version: 1.0.0
  description: |
    사용자 선호도 기반 동네 및 장소 추천, 여행 일정 관리 API
    기능 확실히 정리하고 paths 설계 부분 완료해야 함

components:
  schemas:

    User:
      type: object
      properties:
        id:
          type: integer
        user_id:
          type: string
        password:
          type: string
        nickname:
          type: string
        role:
          type: string
          enum: [USER, ADMIN]

    Preferences:
      type: object
      properties:
        user_id:
          type: integer
        food_preference:
          type: integer
        desert_preference:
          type: integer
        culture_preference:
          type: integer
        time_preference:
          type: integer
        indoor_preference:
          type: boolean
        extrovert_preference:
          type: boolean

    Neighborhood:
      type: object
      properties:
        neighborhood_id:
          type: integer
        neighborhood_name:
          type: string
        neighborhood_latitude:
          type: number
          format: double
        neighborhood_longitude:
          type: number
          format: double

    Place:
      type: object
      properties:
        place_id:
          type: integer
        kakao_place_id:
          type: string
        place_name:
          type: string
        place_category:
          type: string
        address:
          type: string
        latitude:
          type: number
        longitude:
          type: number
        score_food:
          type: integer
        score_cafe:
          type: integer
        score_activity:
          type: integer
        score_culture:
          type: integer
        summary:
          type: string
        open_time:
          type: string
          format: time
        close_time:
          type: string
          format: time
        break_start_time:
          type: string
          format: time
        break_end_time:
          type: string
          format: time
        is_indoor:
          type: boolean
        stay_duration_minutes:
          type: integer
        recommended_slot:
          type: string
        neighborhood_id:
          type: integer

    PlaceSlot:
      type: object
      properties:
        place_id:
          type: integer
        slot_type:
          type: string
          enum:
            - BREAKFAST
            - BRUNCH
            - LUNCH
            - AFTERNOON
            - DINNER
            - EVENING
            - NIGHT
            - ALL_DAY

    UserNeighborhoodMatch:
      type: object
      properties:
        user_id:
          type: integer
        neighborhood_id:
          type: integer
        match_score:
          type: number
          format: float

    Itinerary:
      type: object
      properties:
        itinerary_id:
          type: integer
        user_id:
          type: integer
        itinerary_title:
          type: string
        date:
          type: string
          format: date
        itinerary_generated_by_ai:
          type: boolean
        itinerary_created_at:
          type: string
          format: date-time

    ItineraryPlace:
      type: object
      properties:
        itinerary_place_id:
          type: integer
        itinerary_id:
          type: integer
        place_id:
          type: integer
        visit_order:
          type: integer
        slot_type:
          type: string
          enum:
            - BREAKFAST
            - BRUNCH
            - LUNCH
            - AFTERNOON
            - DINNER
            - EVENING
            - NIGHT
            - ALL_DAY
        memo:
          type: string
        added_at:
          type: string
          format: date-time
